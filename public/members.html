<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FundSphere ERP | Members</title>

    <link rel="stylesheet" href="/css/members.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="wrapper">

    <aside class="sidebar">

        <div class="logo">
            <img src="/images/logo.png" alt="FundSphere Logo">
            <h2>FundSphere ERP</h2>
        </div>

        <ul class="menu">

            <li>
                <a href="/dashboard">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li class="active">
                <a href="/members">
                    <i class="fas fa-users"></i>
                    <span>Members</span>
                </a>
            </li>

        </ul>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <h1>Member Management</h1>

            <div class="top-actions">

                <input type="text" placeholder="Search Member...">

                <a href="/member-form" class="add-link">
                    <button class="add-btn">
                        <i class="fas fa-user-plus"></i>
                        Add Member
                    </button>
                </a>

            </div>

        </header>
        <section class="table-card">

    <div class="table-header">

        <h2>All Members</h2>

        <span>
            Total Members :
            <span th:text="${#lists.size(members)}">0</span>
        </span>

    </div>

    <table>

        <thead>

            <tr>

                <th>ID</th>
                <th>Member Code</th>
                <th>Photo</th>
                <th>Full Name</th>
                <th>CNIC</th>
                <th>Mobile</th>
                <th>Status</th>
                <th>Actions</th>

            </tr>

        </thead>

        <tbody>

            <tr th:each="member : ${members}">

                <td th:text="${member.id}"></td>

                <td th:text="${member.memberCode}"></td>

                <td>
                    <img th:src="@{'/uploads/' + ${member.photoPath}}"
     class="member-photo"
     alt="Photo">
                </td>

                <td th:text="${member.fullName}"></td>

                <td th:text="${member.cnic}"></td>

                <td th:text="${member.mobileNumber}"></td>

                <td>
    <span class="status active"
          th:text="${member.membershipStatus}">
    </span>
</td>

<td>

    <a th:href="@{/members/view/{id}(id=${member.id})}">
        <button class="view-btn">View</button>
    </a>

    <a th:href="@{/members/edit/{id}(id=${member.id})}">
        <button class="edit-btn">Edit</button>
    </a>

    <a th:href="@{/members/delete/{id}(id=${member.id})}"
       onclick="return confirm('Are you sure you want to delete this member?');">
        <button class="delete-btn">Delete</button>
    </a>

</td>

</tr>

</tbody>

</table>

</section>

<div class="pagination">
    <button>&laquo; Previous</button>
    <button class="active-page">1</button>
    <button>Next &raquo;</button>
</div>

</main>

</div>

<script src="/js/members.js"></script>

</body>
</html>
