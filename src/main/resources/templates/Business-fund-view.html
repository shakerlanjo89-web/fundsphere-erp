<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Business Fund Transaction | FundSphere ERP
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .page {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,.08);
            overflow: hidden;
        }

        .header {
            background: #0877d1;
            color: white;
            padding: 25px 30px;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin: 7px 0 0;
        }

        .content {
            padding: 30px;
        }

        .receipt {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 15px;
            border-radius: 8px;
            color: #075da8;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .item {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        .label {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .value {
            font-weight: bold;
            font-size: 16px;
        }

        .amount {
            color: #075da8;
            font-size: 22px;
        }

        .remarks {
            margin-top: 20px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        a {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .print {
            background: #0877d1;
            color: white;
        }

        .edit {
            background: #fef3c7;
            color: #92400e;
        }

        .back {
            background: #6b7280;
            color: white;
        }

        @media(max-width:650px) {

            .grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .content {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

        }

        @media print {

            body {
                background: white;
            }

            .page {
                margin: 0;
                max-width: 100%;
            }

            .card {
                box-shadow: none;
            }

            .buttons {
                display: none;
            }

        }

    </style>

</head>

<body>

<div class="page">

    <div class="card">


        <div class="header">

            <h1>
                Business Fund Transaction
            </h1>

            <p>
                FundSphere ERP
            </p>

        </div>


        <div class="content">


            <div class="receipt">

                Transaction No:

                <span
                    th:text="${businessFund.transactionNo}">
                    BF-000001
                </span>

            </div>


            <div class="grid">


                <div class="item">

                    <div class="label">
                        Transaction Date
                    </div>

                    <div class="value"
                         th:text="${businessFund.transactionDate}">
                        2026-08-08
                    </div>

                </div>


                <div class="item">

                    <div class="label">
                        Transaction Type
                    </div>

                    <div class="value"
                         th:text="${businessFund.transactionType}">
                        Profit
                    </div>

                </div>


                <div class="item">

                    <div class="label">
                        Amount
                    </div>

                    <div class="value amount"
                         th:text="'Rs. ' + ${businessFund.amount}">
                        Rs. 0
                    </div>

                </div>


                <div class="item">

                    <div class="label">
                        Payment Method
                    </div>

                    <div class="value"
                         th:text="${businessFund.paymentMethod}">
                        Cash
                    </div>

                </div>


                <div class="item">

                    <div class="label">
                        Member Code
                    </div>

                    <div class="value"
                         th:text="${businessFund.memberCode}">
                        -
                    </div>

                </div>


                <div class="item">

                    <div class="label">
                        Member Name
                    </div>

                    <div class="value"
                         th:text="${businessFund.memberName}">
                        -
                    </div>

                </div>


                <div class="item">

                    <div class="label">
                        Description
                    </div>

                    <div class="value"
                         th:text="${businessFund.description}">
                        Description
                    </div>

                </div>

            </div>


            <div class="remarks">

                <strong>
                    Remarks
                </strong>

                <p
                    th:text="${businessFund.remarks != null
                    and !businessFund.remarks.isEmpty()
                    ? businessFund.remarks
                    : 'No remarks'}">

                    No remarks

                </p>

            </div>


            <div class="buttons">

                <button
                    onclick="window.print()"
                    class="print">

                    🖨 Print

                </button>


                <a
                    th:href="@{/business-fund/edit/{id}(id=${businessFund.id})}"
                    class="edit">

                    Edit

                </a>


                <a
                    href="/business-fund"
                    class="back">

                    Back

                </a>

            </div>


        </div>

    </div>

</div>

</body>

</html>
