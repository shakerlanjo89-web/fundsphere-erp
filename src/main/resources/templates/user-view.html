<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        FundSphere ERP | View User
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .page {
            max-width: 800px;
            margin: 25px auto;
            padding: 0 18px;
        }

        .header {
            background: linear-gradient(
                135deg,
                #0877d1,
                #075da8
            );

            color: white;
            padding: 23px 27px;

            border-radius: 12px 12px 0 0;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
        }

        .header p {
            margin: 7px 0 0;
            font-size: 13px;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }

        .btn-back {
            background: #064d8e;
            color: white;
        }

        .btn-edit {
            background: #fef3c7;
            color: #92400e;
        }

        .content {
            background: white;
            padding: 28px;
            box-shadow:
                0 4px 15px rgba(0,0,0,.07);
        }

        .user-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .row {
            display: grid;
            grid-template-columns: 180px 1fr;
            border-bottom: 1px solid #e5e7eb;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            background: #f8fafc;
            padding: 14px;
            font-size: 13px;
            font-weight: bold;
            color: #475569;
        }

        .value {
            padding: 14px;
            font-size: 13px;
        }

        .status-active {
            color: #15803d;
            font-weight: bold;
        }

        .status-inactive {
            color: #dc2626;
            font-weight: bold;
        }

        .actions {
            margin-top: 22px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        @media(max-width:600px) {

            .page {
                padding: 0 8px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .label {
                border-bottom: 1px solid #e5e7eb;
            }

        }

    </style>

</head>

<body>

<div class="page">


    <div class="header">

        <div>

            <h1>
                👤 User Details
            </h1>

            <p>
                FundSphere ERP — User Information
            </p>

        </div>


        <a
            href="/user-management"
            class="btn btn-back">

            ← Users

        </a>

    </div>


    <div class="content">


        <div class="user-card">


            <div class="row">

                <div class="label">
                    Username
                </div>

                <div class="value">

                    <strong
                        th:text="${appUser.username}">

                        username

                    </strong>

                </div>

            </div>


            <div class="row">

                <div class="label">
                    Full Name
                </div>

                <div
                    class="value"
                    th:text="${appUser.fullName}">

                    Full Name

                </div>

            </div>


            <div class="row">

                <div class="label">
                    Email
                </div>

                <div
                    class="value"
                    th:text="${appUser.email != null && appUser.email != '' ? appUser.email : '-'}">

                    -

                </div>

            </div>


            <div class="row">

                <div class="label">
                    Role
                </div>

                <div
                    class="value"
                    th:text="${appUser.role}">

                    ADMIN

                </div>

            </div>


            <div class="row">

                <div class="label">
                    Account Status
                </div>

                <div class="value">


                    <span
                        th:if="${appUser.active}"
                        class="status-active">

                        ● Active

                    </span>


                    <span
                        th:if="${!appUser.active}"
                        class="status-inactive">

                        ● Inactive

                    </span>


                </div>

            </div>


        </div>


        <div class="actions">


            <a
                th:href="@{/user-management/edit/{id}(id=${appUser.id})}"
                class="btn btn-edit">

                ✏ Edit User

            </a>


            <a
                href="/user-management"
                class="btn btn-back">

                Back

            </a>


        </div>


    </div>

</div>

</body>

</html>
