<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FundSphere ERP | Member Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {

            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0877d1,
                    #08a6c9,
                    #0bbf65
                );

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }


        .login-card {

            width: 430px;

            max-width: 92%;

            background: white;

            border-radius: 18px;

            padding: 32px 35px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.18);
        }


        .logo {

            display: block;

            width: 75px;

            height: 75px;

            object-fit: contain;

            margin: 0 auto 10px;
        }


        .icon {

            text-align: center;

            font-size: 35px;

            margin-bottom: 5px;
        }


        h1 {

            text-align: center;

            color: #075da8;

            font-size: 26px;

            margin: 0;
        }


        .subtitle {

            text-align: center;

            color: #777;

            font-size: 13px;

            margin: 6px 0 22px;
        }


        .input-group {

            margin-bottom: 16px;
        }


        label {

            display: block;

            margin-bottom: 6px;

            color: #374151;

            font-size: 14px;

            font-weight: bold;
        }


        input {

            width: 100%;

            height: 47px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            padding: 0 13px;

            font-size: 14px;

            outline: none;
        }


        input:focus {

            border-color: #0877d1;

            box-shadow:
                0 0 0 3px
                rgba(8,119,209,.10);
        }


        .password-box {

            position: relative;
        }


        .password-box input {

            padding-right: 45px;
        }


        #togglePassword {

            position: absolute;

            right: 13px;

            top: 50%;

            transform:
                translateY(-50%);

            cursor: pointer;

            font-size: 18px;
        }


        .login-btn {

            width: 100%;

            height: 48px;

            border: none;

            border-radius: 8px;

            background: #2563c7;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        .login-btn:hover {

            background: #1d4fa5;
        }


        .back-btn {

            display: block;

            width: 100%;

            height: 45px;

            line-height: 45px;

            text-align: center;

            text-decoration: none;

            color: #555;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            margin-top: 12px;

            font-size: 14px;
        }


        .footer {

            text-align: center;

            color: #999;

            font-size: 11px;

            line-height: 1.6;

            margin-top: 18px;
        }


        @media(max-width:500px) {

            .login-card {

                padding: 27px 21px;
            }

        }

    </style>

</head>


<body>


<div class="login-card">


    <img
        th:src="@{/images/logo.png}"
        class="logo"
        alt="FundSphere ERP">


    <div class="icon">
        👤
    </div>


    <h1>
        Member Login
    </h1>


    <div class="subtitle">
        Access your FundSphere account
    </div>


    <form
        th:action="@{/member-login/authenticate}"
        method="post">


        <div class="input-group">

            <label for="memberCode">
                Member ID / Code
            </label>

            <input
                type="text"
                id="memberCode"
                name="memberCode"
                placeholder="Example: FSP-000001"
                autocomplete="username"
                required>

        </div>


        <div class="input-group">

            <label for="password">
                Password
            </label>


            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    autocomplete="current-password"
                    required>


                <span
                    id="togglePassword">

                    👁

                </span>

            </div>

        </div>


        <button
            type="submit"
            class="login-btn">

            🔐 Member Login

        </button>


    </form>


    <a
        href="/login"
        class="back-btn">

        ← Back to Admin Login

    </a>


    <div class="footer">

        <div>
            FundSphere ERP
        </div>

        <div>
            Member Management System
        </div>

        <div style="margin-top:7px;">

            Please contact with Admin
            <strong>Dua Digital Studio</strong>

            <br>

            <strong>+92 321 2837377</strong>

        </div>

    </div>


</div>



<script>

const togglePassword =
    document.getElementById(
        "togglePassword"
    );

const password =
    document.getElementById(
        "password"
    );


togglePassword.addEventListener(
    "click",
    function () {

        if (
            password.type ===
            "password"
        ) {

            password.type =
                "text";

            togglePassword.innerText =
                "🙈";

        } else {

            password.type =
                "password";

            togglePassword.innerText =
                "👁";

        }

    }
);


/* =====================================================
   ERROR POPUP
   ===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


if (
    urlParams.get("error")
    === "true"
) {

    alert(
        "Please contact with Admin Dua Digital Studio\n+92 321 2837377"
    );

}


if (
    urlParams.get("logout")
    === "true"
) {

    alert(
        "You have been successfully logged out."
    );

}

</script>


</body>

</html>
